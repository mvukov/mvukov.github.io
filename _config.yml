title: Milan Vukov
tagline: Robotics Software Architect
description: >-
  Robotics software architect focused on navigation, localization and system
  integration. Author of rules_ros2, Bazel rules for ROS 2.
author: Milan Vukov
url: "https://mvukov.github.io"
baseurl: ""

# Theme
theme: minima
# Or use: remote_theme: pages-themes/minimal@v0.2.0

# Development settings
livereload: true
incremental: true

# Markdown settings
markdown: kramdown
highlighter: rouge

# Collections for projects
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Default settings for collections
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Social links (optional)
github_username: mvukov
linkedin_username: mvukov

# Structured data (jekyll-seo-tag)
social:
  name: Milan Vukov
  links:
    - https://www.linkedin.com/in/mvukov/
    - https://github.com/mvukov
    - https://scholar.google.com/citations?user=gnSTyOMAAAAJ
    - https://www.researchgate.net/profile/Milan_Vukov

# Navigation (the site title already links home)
header_pages:
  - projects.md

exclude:
  - scripts/
  - .devcontainer/
  - .vscode/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
